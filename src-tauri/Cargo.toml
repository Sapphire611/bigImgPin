[package]
name = "bigimgpin"
version = "0.1.0"
description = "Desktop viewer and annotator for gigapixel industrial imagery (layout / microscopy). Ships with its own libvips runtime."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bigimgpin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"

# 缺陷图要从 MinIO 取:zip 内图片必须带 x-minio-extract 请求头,<img> 设不了。
# reqwest 本来就在更新插件的依赖树里,这里只是直接用它;minio 是 http,不需要 TLS。
reqwest = { version = "0.13", default-features = false }
# 注意:tauri-plugin-updater 打开的是 reqwest 的 `rustls-no-provider`,**即使只访问
# http**,建 Client 时也会初始化 rustls;全局没有 crypto provider 就直接 panic。
# 这里把 rustls 暴露出来,在 run() 开头装一个默认 provider(见 lib.rs)。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.22"
percent-encoding = "2"

# 取消切片时要给子进程发信号
[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
